name: Build unsigned iOS IPA

# Builds Madeira end to end on a macOS runner and uploads an UNSIGNED IPA.
# The user signs it later with their own Apple ID (SideStore, AltStore,
# Sideloadly, Plume, ...). Steps follow docs/BUILDING.md.

on:
  workflow_dispatch:
    inputs:
      wow64:
        description: "Also build the 32-bit (WoW64) pieces"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_TAG: "20260421"
  LLVM_MINGW_TARBALL: llvm-mingw-20260421-ucrt-macos-universal.tar.xz
  LLVM_MINGW_SHA256: bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7
  LLVM_PROJECT_COMMIT: 8dfdcc7b7

jobs:
  # LLVM for iOS takes hours. It is built once and kept in the Actions cache
  # (main-branch caches are readable from other branches).
  llvm-ios:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4   # no submodules needed here

      - name: Restore LLVM cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: llvm-ios-${{ env.LLVM_PROJECT_COMMIT }}-v1

      - name: Install tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install cmake ninja

      - name: Build LLVM (host tablegen + iOS libs)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p toolchains && cd toolchains
          git clone --filter=blob:none https://github.com/llvm/llvm-project.git
          git -C llvm-project checkout "$LLVM_PROJECT_COMMIT"

          # Host build, only used for llvm-tblgen etc.
          cmake -S llvm-project/llvm -B llvm-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD= \
            -DLLVM_INCLUDE_TESTS=Off
          cmake --build llvm-host-build --target llvm-tblgen

          # iOS build, flags copied from docs/BUILDING.md.
          # LLVM_NO_DEAD_STRIP: LLVM only uses Apple's -dead_strip when
          # CMAKE_SYSTEM_NAME is "Darwin". With "iOS" it falls through to the
          # GNU branch and passes -Wl,--gc-sections, which Apple's ld rejects
          # ("ld: unknown options: --gc-sections" while linking bin/llvm-ar).
          #
          # LLVM_ENABLE_PLUGINS=OFF / LLVM_INCLUDE_EXAMPLES=OFF: with
          # CMAKE_SYSTEM_NAME=iOS LLVM thinks loadable modules work and builds
          # LLVMHello/Bye as MODULE libraries. Linking them fails ("ld: unknown
          # file type .../LLVMHello.def"), and nothing downstream needs them -
          # only lib/*.a is consumed. LTO/Remarks shared libs are skipped for
          # the same reason.
          cmake -S llvm-project/llvm -B llvm-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_TARGET_ARCH=host -DLLVM_TARGETS_TO_BUILD= \
            -DLLVM_ENABLE_PROJECTS= -DLLVM_BUILD_TOOLS=Off \
            -DLLVM_INCLUDE_TESTS=Off -DLLVM_ENABLE_ZLIB=Off \
            -DCMAKE_MACOSX_BUNDLE=OFF -DLLVM_NO_DEAD_STRIP=ON \
            -DLLVM_ENABLE_PLUGINS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_TOOL_LTO_BUILD=OFF -DLLVM_TOOL_REMARKS_SHLIB_BUILD=OFF \
            -DLLVM_TABLEGEN="$PWD/llvm-host-build/bin/llvm-tblgen"

          # Keep the full build output and surface the first real error, so a
          # failure is readable without scrolling through thousands of lines.
          if ! cmake --build llvm-ios-build 2>&1 | tee "$PWD/llvm-ios-build.log"; then
            echo "::group::First failing command and error lines"
            grep -n -m1 -A40 "^FAILED:" llvm-ios-build.log || true
            grep -n "error:" llvm-ios-build.log | head -n 30 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload LLVM build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-ios-build-log
          path: toolchains/llvm-ios-build.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: llvm-ios
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # FEX has a nested rpmalloc fork
          fetch-depth: 1

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install cmake ninja meson bison ldid p7zip
          brew install rustup || true
          # Homebrew's rustup is keg-only: its cargo/rustc proxies are not on
          # PATH, which later steps (build/rppairing-ios/build.sh) need.
          RUSTUP_BIN="$(brew --prefix rustup)/bin"
          export PATH="$RUSTUP_BIN:$HOME/.cargo/bin:$PATH"
          echo "$RUSTUP_BIN" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup default stable || true
          rustup target add aarch64-apple-ios
          cargo --version
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"   # wrc needs bison 3

      - name: Restore LLVM (iOS)
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: llvm-ios-${{ env.LLVM_PROJECT_COMMIT }}-v1
          fail-on-cache-miss: true

      - name: Fetch llvm-mingw
        run: |
          set -euxo pipefail
          mkdir -p toolchains && cd toolchains
          curl -fsSL -O "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/${LLVM_MINGW_TARBALL}"
          echo "${LLVM_MINGW_SHA256}  ${LLVM_MINGW_TARBALL}" | shasum -a 256 -c -
          tar -xf "${LLVM_MINGW_TARBALL}"
          rm "${LLVM_MINGW_TARBALL}"
          ls

      # Private fork only: the Microsoft VC++ x64 runtime DLLs are committed
      # as prebuilt/vcruntime.zip (DLLs at the zip root, unmodified). Do not
      # make this repo or the built IPA public with these included.
      - name: Unpack VC++ runtime (committed zip, private fork)
        run: |
          set -euo pipefail
          dir=app/Madeira/x86_64-vcruntime
          mkdir -p "$dir"
          unzip -o prebuilt/vcruntime.zip -d "$dir"
          missing=0
          for f in concrt140 msvcp140 msvcp140_1 msvcp140_2 msvcp140_atomic_wait \
                   msvcp140_codecvt_ids vcamp140 vccorlib140 vcomp140 \
                   vcruntime140 vcruntime140_1 vcruntime140_threads; do
            [ -f "$dir/$f.dll" ] || { echo "::error::missing $dir/$f.dll (zip must have DLLs at its root)"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          ls "$dir"

      # ---- native build chains, same order as docs/BUILDING.md ----
      - name: GnuTLS / GMP / Nettle
        run: bash build/gnutls-ios/build.sh

      - name: FFmpeg (LGPL-only)
        run: bash build/ffmpeg/build.sh

      - name: FEX (iOS + ARM64EC)
        run: |
          bash build/fex-ios/build.sh
          bash build/fex-arm64ec/build.sh

      # The unix-side scripts compile against a configured Wine tree
      # (wine/build-macos: config.h + widl headers; wine/build-arm64ec:
      # dwrite headers) and a static FreeType. None of that is in the repo.
      - name: FreeType (iOS)
        run: |
          set -euxo pipefail
          if [ ! -f research/freetype/include/ft2build.h ]; then
            rm -rf research/freetype
            git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          fi
          bash build/freetype-ios/build.sh

      - name: Wine host trees (config.h + generated headers)
        run: bash build/wine-host/build.sh

      # server_ios.c's [xp] profiler reads rusage_info_v6.ri_page_wait_time_mach,
      # which only the iOS 27 SDK declares. This runner has SDK 26.x, so drop
      # that one diagnostic counter (it just prints pgw=0.0).
      - name: Compat patch for iOS 26 SDK
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("build/ntdll-unix/server_ios.c")
          s = p.read_text()
          old = "XP_MS( ru.ri_page_wait_time_mach - pru.ri_page_wait_time_mach )"
          if old in s:
              p.write_text(s.replace(old, "XP_MS( 0 )"))
              print("patched ri_page_wait_time_mach")
          else:
              print("nothing to patch")
          PY

      - name: Wine unix side
        run: |
          # wineserver/build.sh needs llvm-objcopy (symbol rename sweep).
          # Appended to PATH so Apple's clang is not shadowed.
          brew list llvm >/dev/null 2>&1 || brew install llvm
          export PATH="$PATH:$(brew --prefix llvm)/bin"
          command -v llvm-objcopy
          bash build/ntdll-unix/build.sh
          bash build/wineserver/bootstrap.sh
          bash build/wineserver/build.sh
          bash build/win32u-unix/build.sh

      - name: Wine PE side (ARM64EC)
        run: |
          bash build/wine-pe/build-ntdll.sh
          bash build/wine-pe/build-modules.sh
          bash build/wine-pe/build-modules.sh dcomp ktmw32

      # airconv/madeira_ags include LLVM's SOURCE headers (toolchains/llvm-project/
      # llvm/include). The LLVM cache only holds the build dirs, so fetch just
      # the headers of the pinned release (8dfdcc7b7 = llvmorg-15.0.7).
      - name: LLVM 15 source headers
        run: |
          set -euxo pipefail
          if [ ! -f toolchains/llvm-project/llvm/include/llvm/IR/Module.h ]; then
            rm -rf toolchains/llvm-project
            git clone --depth 1 --filter=blob:none --sparse --branch llvmorg-15.0.7 \
              https://github.com/llvm/llvm-project.git toolchains/llvm-project
            git -C toolchains/llvm-project sparse-checkout set llvm/include
          fi
          git -C toolchains/llvm-project rev-parse HEAD | grep -q '^8dfdcc7b7'
          test -f toolchains/llvm-project/llvm/include/llvm/IR/Module.h
          test -f toolchains/llvm-ios-build/include/llvm/Config/llvm-config.h

      # airconv_context.cpp includes air_msad.h (and the other two); DXMT's meson
      # build makes them from shaders/*.metal. build.sh only generates
      # dxmt_command.h, so produce the airconv ones the same way (metal + xxd).
      - name: DXMT airconv shader headers
        run: |
          set -euxo pipefail
          out=build/dxmt-ios/shader-headers
          mkdir -p "$out"
          for n in air_msad air_samplepos air_tessellation; do
            xcrun -sdk macosx metal -std=metal3.1 --target=air64-apple-macos14.0 \
              -o "$out/$n.air" -c "dxmt/src/airconv/shaders/$n.metal"
            (cd "$out" && xxd -n "$n" -i "$n.air" "$n.h")
          done
          ls -l "$out"

      - name: DXMT
        run: |
          bash build/dxmt-ios/build.sh
          # The app links libdxmt_combined.a = DXMT unix objects + the iOS LLVM
          # archives airconv needs. build.sh only refreshes it if it exists.
          xcrun -sdk iphoneos libtool -static -o build/dxmt-ios/libdxmt_combined.a \
            build/dxmt-ios/obj/*.o toolchains/llvm-ios-build/lib/*.a
          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/libdxmt_combined.a
          # dxmt/build-arm64ec-win.txt locates llvm-mingw via @GLOBAL_SOURCE_ROOT@
          # (= dxmt/) + toolchains/..., but our toolchains/ sits at the repo root.
          if [ ! -e dxmt/toolchains ]; then ln -s "$PWD/toolchains" dxmt/toolchains; fi
          test -x dxmt/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/arm64ec-w64-mingw32-clang
          # BUILDING.md's ../../wine/build-arm64ec assumes dxmt at research/dxmt;
          # here it is dxmt/, so that path resolves outside the repo. Use an
          # absolute path. winemetal also links libdbghelp, an import lib that
          # no earlier step builds (winecrt0 and ntdll are already there).
          MINGW="$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin"
          PATH="$MINGW:$PATH" make -C wine/build-arm64ec -j4 dlls/dbghelp/arm64ec-windows/libdbghelp.a
          test -f wine/build-arm64ec/dlls/dbghelp/arm64ec-windows/libdbghelp.a
          meson setup dxmt/build-arm64ec dxmt -Dbuildtype=release \
            -Dwine_build_path="$PWD/wine/build-arm64ec" \
            --cross-file=dxmt/build-arm64ec-win.txt
          ninja -C dxmt/build-arm64ec src/winemetal/winemetal.dll
          ninja -C dxmt/build-arm64ec src/d3d11/d3d11.dll || true   # path may differ, check
          cp dxmt/build-arm64ec/src/winemetal/winemetal.dll app/Madeira/arm64ec-windows/
          find dxmt/build-arm64ec -name d3d11.dll -exec cp {} app/Madeira/arm64ec-windows/ \;

      - name: DXMT compile errors (on failure)
        if: failure()
        run: |
          for f in build/dxmt-ios/obj/*.err; do
            if [ -s "$f" ]; then echo "::group::$f"; head -n 25 "$f"; echo "::endgroup::"; fi
          done

      - name: In-app pairing (Rust)
        run: bash build/rppairing-ios/build.sh

      - name: Direct3D 12 runtime
        # The converter dylib and headers are tracked; build/madeira-d3d12/deps.sh
        # verifies them against their pinned hashes. fetch-converter.sh needs
        # Apple's gitignored installer package (research/GPTK/) and is a
        # maintainer-only step for converter updates, so CI does not run it.
        run: bash build/madeira-d3d12/build-pe.sh

      - name: WoW64 (optional)
        if: ${{ inputs.wow64 }}
        run: |
          bash build/wine-i386/build.sh
          bash build/fex-wow64/build.sh

      - name: Refresh bundled licenses
        run: bash build/stage-licenses.sh

      # ---- app, unsigned ----
      - name: Build app (Debug, no code signing)
        run: |
          set -euxo pipefail
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira \
            -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name 'Madeira.app' | head -1)
          test -n "$APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/

          # Fake-sign with the entitlements (JIT / increased memory limit) so a
          # sideloader can merge them when it re-signs. Skipped if none found.
          ENT=$(find app -maxdepth 3 -name '*.entitlements' | head -1 || true)
          if [ -n "$ENT" ]; then
            ldid -S"$ENT" ipa/Payload/Madeira.app/Madeira
          fi

          (cd ipa && zip -qry ../Madeira-unsigned.ipa Payload)
          ls -lh Madeira-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
