name: Build unsigned iOS IPA

# Builds Madeira end to end on a macOS runner and uploads an UNSIGNED IPA.
# The user signs it later with their own Apple ID (SideStore, AltStore,
# Sideloadly, Plume, ...). Steps follow docs/BUILDING.md.

on:
  workflow_dispatch:
    inputs:
      wow64:
        description: "Also build the 32-bit (WoW64) pieces"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_TAG: "20260421"
  LLVM_MINGW_TARBALL: llvm-mingw-20260421-ucrt-macos-universal.tar.xz
  LLVM_MINGW_SHA256: bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7
  LLVM_PROJECT_COMMIT: 8dfdcc7b7

jobs:
  # LLVM for iOS takes hours. It is built once and kept in the Actions cache
  # (main-branch caches are readable from other branches).
  llvm-ios:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4   # no submodules needed here

      - name: Restore LLVM cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: llvm-ios-${{ env.LLVM_PROJECT_COMMIT }}-v1

      - name: Install tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install cmake ninja

      - name: Build LLVM (host tablegen + iOS libs)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p toolchains && cd toolchains
          git clone --filter=blob:none https://github.com/llvm/llvm-project.git
          git -C llvm-project checkout "$LLVM_PROJECT_COMMIT"

          # Host build, only used for llvm-tblgen etc.
          cmake -S llvm-project/llvm -B llvm-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD= \
            -DLLVM_INCLUDE_TESTS=Off
          cmake --build llvm-host-build --target llvm-tblgen

          # iOS build, flags copied from docs/BUILDING.md
          cmake -S llvm-project/llvm -B llvm-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_TARGET_ARCH=host -DLLVM_TARGETS_TO_BUILD= \
            -DLLVM_ENABLE_PROJECTS= -DLLVM_BUILD_TOOLS=Off \
            -DLLVM_INCLUDE_TESTS=Off -DLLVM_ENABLE_ZLIB=Off \
            -DLLVM_TABLEGEN="$PWD/llvm-host-build/bin/llvm-tblgen"
          cmake --build llvm-ios-build

  build:
    needs: llvm-ios
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # FEX has a nested rpmalloc fork
          fetch-depth: 1

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install cmake ninja meson bison ldid p7zip
          brew install rustup || true
          rustup default stable || true
          rustup target add aarch64-apple-ios
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"   # wrc needs bison 3

      - name: Restore LLVM (iOS)
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: llvm-ios-${{ env.LLVM_PROJECT_COMMIT }}-v1
          fail-on-cache-miss: true

      - name: Fetch llvm-mingw
        run: |
          set -euxo pipefail
          mkdir -p toolchains && cd toolchains
          curl -fsSL -O "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/${LLVM_MINGW_TARBALL}"
          echo "${LLVM_MINGW_SHA256}  ${LLVM_MINGW_TARBALL}" | shasum -a 256 -c -
          tar -xf "${LLVM_MINGW_TARBALL}"
          rm "${LLVM_MINGW_TARBALL}"
          ls

      - name: Fetch VC++ runtime (your own copy)
        env:
          # Secret or repo variable: URL of a private zip containing the x64
          # VC++ DLLs (see tools/fetch-vcruntime.md). Not redistributable
          # publicly, so keep the artifact private.
          VCRUNTIME_URL: ${{ secrets.VCRUNTIME_ZIP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VCRUNTIME_URL:-}" ]; then
            echo "::error::Set secret VCRUNTIME_ZIP_URL (see tools/fetch-vcruntime.md)"; exit 1
          fi
          mkdir -p app/Madeira/x86_64-vcruntime
          curl -fsSL "$VCRUNTIME_URL" -o /tmp/vcruntime.zip
          unzip -o /tmp/vcruntime.zip -d app/Madeira/x86_64-vcruntime
          ls app/Madeira/x86_64-vcruntime

      # ---- native build chains, same order as docs/BUILDING.md ----
      - name: GnuTLS / GMP / Nettle
        run: bash build/gnutls-ios/build.sh

      - name: FFmpeg (LGPL-only)
        run: bash build/ffmpeg/build.sh

      - name: FEX (iOS + ARM64EC)
        run: |
          bash build/fex-ios/build.sh
          bash build/fex-arm64ec/build.sh

      - name: Wine unix side
        run: |
          bash build/ntdll-unix/build.sh
          bash build/wineserver/build.sh
          bash build/win32u-unix/build.sh

      - name: Wine PE side (ARM64EC)
        run: |
          bash build/wine-pe/build-ntdll.sh
          bash build/wine-pe/build-modules.sh
          bash build/wine-pe/build-modules.sh dcomp ktmw32

      - name: DXMT
        run: |
          bash build/dxmt-ios/build.sh
          meson setup dxmt/build-arm64ec dxmt -Dbuildtype=release \
            -Dwine_build_path=../../wine/build-arm64ec \
            --cross-file=dxmt/build-arm64ec-win.txt
          ninja -C dxmt/build-arm64ec src/winemetal/winemetal.dll
          ninja -C dxmt/build-arm64ec src/d3d11/d3d11.dll || true   # path may differ, check
          cp dxmt/build-arm64ec/src/winemetal/winemetal.dll app/Madeira/arm64ec-windows/
          find dxmt/build-arm64ec -name d3d11.dll -exec cp {} app/Madeira/arm64ec-windows/ \;

      - name: In-app pairing (Rust)
        run: bash build/rppairing-ios/build.sh

      - name: Direct3D 12 runtime
        run: |
          bash build/madeira-d3d12/fetch-converter.sh
          bash build/madeira-d3d12/build-pe.sh

      - name: WoW64 (optional)
        if: ${{ inputs.wow64 }}
        run: |
          bash build/wine-i386/build.sh
          bash build/fex-wow64/build.sh

      - name: Refresh bundled licenses
        run: bash build/stage-licenses.sh

      # ---- app, unsigned ----
      - name: Build app (Debug, no code signing)
        run: |
          set -euxo pipefail
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira \
            -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name 'Madeira.app' | head -1)
          test -n "$APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/

          # Fake-sign with the entitlements (JIT / increased memory limit) so a
          # sideloader can merge them when it re-signs. Skipped if none found.
          ENT=$(find app -maxdepth 3 -name '*.entitlements' | head -1 || true)
          if [ -n "$ENT" ]; then
            ldid -S"$ENT" ipa/Payload/Madeira.app/Madeira
          fi

          (cd ipa && zip -qry ../Madeira-unsigned.ipa Payload)
          ls -lh Madeira-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
